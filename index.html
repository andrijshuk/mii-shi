<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мій ШІ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2ff;color:#172554}
header{background:#4338ca;color:white;padding:18px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:10px;padding:12px;background:#4338ca;color:white;font-size:16px;cursor:pointer}
input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin:6px 0}
#messages{height:45vh;min-height:250px;overflow-y:auto}
.msg{padding:10px;margin:8px 0;border-radius:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.me{background:#dbeafe;text-align:right}
.bot{background:#f1f5f9}
.row{display:flex;gap:8px}
.row button{flex:1}
.small{font-size:13px;color:#64748b}
</style>
</head>
<body>
<header>🤖 Мій ШІ</header>
<main>
<div class="card">
<h3>Привіт! Я твій асистент.</h3>
<p>Тут ти можеш записувати повідомлення та зберігати нотатки.</p>
</div>
<div class="card">
<h3>💬 Чат</h3>
<div id="messages">
<div class="msg bot">Привіт! Напиши мені щось нижче.</div>
</div>
<input id="question" placeholder="Напиши повідомлення...">
<button style="width:100%" onclick="sendMessage()">Надіслати</button>
<p class="small">Ця версія працює без підключення до сервера. Для справжніх відповідей ШІ потрібне окреме безпечне підключення.</p>
</div>
<div class="card">
<h3>📝 Мої нотатки</h3>
<textarea id="notes" rows="4" placeholder="Запиши те, що потрібно пам'ятати..."></textarea>
<div class="row">
<button onclick="saveNotes()">Зберегти</button>
<button onclick="clearNotes()">Очистити</button>
</div>
<p id="status" class="small"></p>
</div>
</main>
<script>
const box=document.getElementById("messages");
const question=document.getElementById("question");
function addMessage(text,kind){
 const div=document.createElement("div");
 div.className="msg "+kind;
 div.textContent=text;
 box.appendChild(div);
 box.scrollTop=box.scrollHeight;
}
function sendMessage(){
 const text=question.value.trim();
 if(!text)return;
 addMessage(text,"me");
 addMessage("Я отримав твоє повідомлення. Щоб відповідати як справжній ШІ, мене потрібно підключити до ШІ-сервісу.","bot");
 question.value="";
 question.focus();
}
question.addEventListener("keydown",function(e){
 if(e.key==="Enter"){e.preventDefault();sendMessage();}
});
function saveNotes(){
 try{
  localStorage.setItem("mii-shi-notes",document.getElementById("notes").value);
  document.getElementById("status").textContent="Нотатки збережено!";
 }catch(e){
  document.getElementById("status").textContent="Не вдалося зберегти нотатки.";
 }
}
function clearNotes(){
 if(confirm("Очистити всі нотатки?")){
  document.getElementById("notes").value="";
  localStorage.removeItem("mii-shi-notes");
  document.getElementById("status").textContent="Нотатки очищено.";
 }
}
try{
 document.getElementById("notes").value=localStorage.getItem("mii-shi-notes")||"";
}catch(e){}
</script>
</body>
</html>
